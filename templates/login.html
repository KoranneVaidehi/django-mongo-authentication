<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(120deg, #141e30, #243b55);
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px 50px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 20px;
            border: none;
            background: #00c6ff;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00a3d9;
        }

        .error {
            color: #ffb3b3;
            margin-top: 10px;
        }

        .links {
            margin-top: 20px;
        }

        .links a {
            color: #00c6ff;
            text-decoration: none;
            font-size: 14px;
            display: block;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="links">
        <a href="{% url 'signup' %}">Create new account</a>
        <a href="{% url 'home' %}">← Back to Home</a>
    </div>
</div>

</body>
</html>
